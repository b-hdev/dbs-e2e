services:
  # 1. Backend Fastify (Sobe primeiro e aguarda ficar saudável)
  dbs-backend:
    build:
      context: ./DBS/backend
      dockerfile: Dockerfile
    container_name: dbs-backend
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - NODE_ENV=production
    env_file:
      - ./DBS/backend/.env
    networks:
      - dbs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 2. Frontend / Mobile Web (Sobe após a API estar 100% pronta)
  dbs-mobile:
    build:
      context: ./DBS/mobile
      dockerfile: Dockerfile
    container_name: dbs-mobile
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      dbs-backend:
        condition: service_healthy
    networks:
      - dbs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dbs-network:
    driver: bridge
